name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em/en dashes in tracked text
        run: sh tests/no-fancy-dashes.sh

      - name: Lua geometry tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 tests/geometry_spec.lua
